name: Validate machine assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate agent index
        run: python scripts/validate_agent_index.py

      - name: Validate discovery assets
        run: python scripts/validate_discovery_assets.py

      - name: Validate economic integrity assets
        run: python scripts/validate_economic_integrity.py

      - name: Validate founder outcome template
        run: python scripts/validate_founder_outcome.py templates/FOUNDER_OUTCOME_RECORD.json --allow-draft

      - name: Validate fiscal evidence template
        run: python scripts/validate_fiscal_evidence.py templates/FISCAL_TRANSACTION_EVIDENCE.json

      - name: Validate entity governance template
        run: python scripts/validate_entity_governance.py templates/ENTITY_GOVERNANCE_RECORD.json

      - name: Validate workflow ROI template
        run: python scripts/workflow_roi.py templates/WORKFLOW_ROI_ANALYSIS.json --validate-only

      - name: Validate customer success template
        run: python scripts/validate_customer_success.py templates/CUSTOMER_SUCCESS_RECORD.json

      - name: Test discovery runtime and repository tooling
        run: python -m unittest discover -s tests -p 'test_*.py'
