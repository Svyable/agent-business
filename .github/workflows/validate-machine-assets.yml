name: Validate machine assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate agent index
        run: python scripts/validate_agent_index.py

      - name: Validate discovery assets
        run: python scripts/validate_discovery_assets.py

      - name: Validate economic integrity assets
        run: python scripts/validate_economic_integrity.py

      - name: Test discovery runtime
        run: python -m unittest discover -s tests -p 'test_*.py'
